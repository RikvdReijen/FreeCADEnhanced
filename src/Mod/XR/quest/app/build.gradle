plugins {
    id 'com.android.application'
}

// ---------------------------------------------------------------------------
// local.properties: SDK location, the optional Meta OpenXR SDK path, the
// Google OAuth client and the release signing material. None of it is
// committed.
// ---------------------------------------------------------------------------
def localProperties = new Properties()
def localFile = rootProject.file('local.properties')
if (localFile.exists()) {
    localFile.withInputStream { localProperties.load(it) }
}
def prop = { String name, String fallback = '' ->
    localProperties.getProperty(name) ?: (project.findProperty(name) ?: fallback)
}

def metaXrSdkDir = prop('metaXrSdkDir')
def useMetaSdk = !metaXrSdkDir.isEmpty()
if (useMetaSdk && !file(metaXrSdkDir).exists()) {
    throw new GradleException("metaXrSdkDir points at ${metaXrSdkDir}, which does not exist")
}

android {
    namespace 'org.freecad.xr'
    compileSdk 34
    ndkVersion '26.3.11579264'

    defaultConfig {
        applicationId 'org.freecad.xr'
        minSdk 29          // Quest 2 and later
        targetSdk 34
        versionCode 1
        versionName '1.0'

        ndk {
            // Quest is arm64 only; shipping anything else just bloats the APK.
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static',
                          '-DANDROID_ARM_NEON=TRUE',
                          "-DMETA_XR_SDK_DIR=${metaXrSdkDir}",
                          "-DUSE_META_XR_SDK=${useMetaSdk ? 'ON' : 'OFF'}"
                cppFlags '-std=c++17', '-Wall', '-Wextra', '-Wno-unused-parameter',
                         '-Wno-missing-field-initializers', '-fno-exceptions', '-fno-rtti'
            }
        }

        buildConfigField 'String', 'GOOGLE_CLIENT_ID', "\"${prop('googleClientId')}\""
        buildConfigField 'String', 'GOOGLE_CLIENT_SECRET', "\"${prop('googleClientSecret')}\""
        buildConfigField 'String', 'DRIVE_SCOPE',
                "\"${prop('driveScope', 'https://www.googleapis.com/auth/drive.file')}\""
    }

    signingConfigs {
        release {
            if (!prop('storeFile').isEmpty()) {
                storeFile file(prop('storeFile'))
                storePassword prop('storePassword')
                keyAlias prop('keyAlias')
                keyPassword prop('keyPassword')
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
            // The debug key Android Studio generates is enough to sideload.
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'
            if (!prop('storeFile').isEmpty()) {
                signingConfig signingConfigs.release
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildFeatures {
        buildConfig true
        prefab true       // the OpenXR loader AAR ships headers + .so via prefab
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        jniLibs {
            // The loader is already stripped; keeping it uncompressed lets the
            // runtime map it directly.
            useLegacyPackaging false
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    if (!useMetaSdk) {
        // Khronos' loader AAR: headers and libopenxr_loader.so for Android,
        // which is what runs on Quest when the Meta SDK is not unpacked.
        implementation 'org.khronos.openxr:openxr_loader_for_android:1.1.36'
    }
}

// ---------------------------------------------------------------------------
// Environment specs: `tools/gen_environments.py` on the desktop writes
// Resources/environments/*.json; the APK carries a copy (§5).
// ---------------------------------------------------------------------------
def environmentSource = file("${rootDir}/../Resources/environments")
def environmentTarget = file('src/main/assets/environments')

tasks.register('copyEnvironments', Copy) {
    description = 'Copies the generated environment specs into the APK assets.'
    group = 'build'
    from(environmentSource) {
        include '*.json'
    }
    into environmentTarget
    doFirst {
        if (!environmentSource.exists()) {
            logger.warn("environment specs not found at ${environmentSource}; " +
                        'run tools/gen_environments.py in the workbench first')
        }
    }
}

tasks.register('checkGlyphTable', Exec) {
    description = 'Verifies glyph_table.inc still matches xrenv/spec.py.'
    group = 'verification'
    commandLine 'python3', "${rootDir}/tools/gen_glyphs.py", '--check'
    ignoreExitValue = true
}

tasks.configureEach { task ->
    if (task.name.startsWith('merge') && task.name.endsWith('Assets')) {
        task.dependsOn 'copyEnvironments'
    }
}
